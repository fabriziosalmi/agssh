# goreleaser v2 — cross-platform static binaries + checksums for GitHub Releases.
# Validate locally with `goreleaser check`; CI runs `build --snapshot` on every PR.
version: 2
project_name: agssh

before:
  hooks:
    - go mod tidy

builds:
  - id: agssh
    main: ./cmd/agssh
    binary: agssh
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
  # The MCP server ships alongside the runner in every archive, so
  # `claude mcp add agssh -- agssh-mcp` works from any downloaded release.
  - id: agssh-mcp
    main: ./cmd/agssh-mcp
    binary: agssh-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Homebrew tap (fabriziosalmi/homebrew-agssh). Same pattern as flareover: to
# publish the formula, add a repo-scoped PAT as the HOMEBREW_TAP_TOKEN secret.
# Until that secret exists the step skips itself (skip_upload), so a release
# never fails for it.
brews:
  - name: agssh
    repository:
      owner: fabriziosalmi
      name: homebrew-agssh
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://agssh.dev"
    description: "Deterministic, fail-closed conformance runner for air-gapped static surfaces (AGSSH-STD-001)"
    license: "Apache-2.0"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    commit_author:
      name: goreleaser-bot
      email: bot@agssh.dev
    install: |
      bin.install "agssh"
      bin.install "agssh-mcp"
    caveats: |
      Dynamic checks (pre-consent egress, offline proof, egress canary) need a
      headless Chrome/Chromium: install one and, if it is not on the default path,
      export AGSSH_CHROME=/path/to/chrome. Without it those rules report
      INCONCLUSIVE (fail-closed), never a silent pass.
      Gold-profile signing needs cosign:  brew install cosign
      Try it:  agssh scan https://example.com
      Agents:  claude mcp add agssh -- agssh-mcp
    test: |
      system "#{bin}/agssh", "-version"

release:
  draft: false
  prerelease: auto
