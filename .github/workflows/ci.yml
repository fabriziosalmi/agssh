name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: test with coverage (race)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: |
          go tool cover -func=coverage.out | tee /tmp/cover.txt
          total=$(grep -E '^total:' /tmp/cover.txt | awk '{print $3}')
          echo "### Coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"
      - name: rule manifest must not be stale vs the spec
        run: |
          python3 standard/build_pdf.py
          git diff --exit-code -- internal/rules/manifest.yaml internal/rules/version_gen.go \
            || { echo "::error::generated files drifted from standard/build_pdf.py — regenerate: cd standard && python build_pdf.py"; exit 1; }
      - name: hand-written docs must match the generator (count + version)
        run: python3 standard/sync_readme.py --check

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
