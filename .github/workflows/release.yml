name: release

on:
  push:
    # Full semver tags only — the moving major tag (v1) must not trigger a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # Publishes ghcr.io/<owner>/agssh so the Action can run from a prebuilt image
    # (action.yml: image: docker://ghcr.io/fabriziosalmi/agssh:1.0.0) instead of
    # rebuilding the Dockerfile on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Derive version
        id: v
        run: |
          ref="${GITHUB_REF_NAME}"          # e.g. v1.0.0
          ver="${ref#v}"                     # 1.0.0
          major="${ver%%.*}"                 # 1
          echo "ver=$ver"     >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agssh:${{ steps.v.outputs.ver }}
            ghcr.io/${{ github.repository_owner }}/agssh:${{ steps.v.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/agssh:latest

  retag-major:
    # Only after BOTH the release artifacts and the image exist does the moving
    # major git tag (v1) follow — so @v1 consumers never resolve an action.yml
    # whose pinned image is not published yet. Logic lives in retag-major.yml
    # (single source; also manually dispatchable for retroactive moves).
    needs: [goreleaser, image]
    permissions:
      contents: write
    uses: ./.github/workflows/retag-major.yml
