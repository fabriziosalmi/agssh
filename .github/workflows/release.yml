name: release

on:
  push:
    # Full semver tags only — the moving major tag (v1) must not trigger a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # Publishes ghcr.io/<owner>/agssh so the Action can run from a prebuilt image
    # (action.yml: image: docker://ghcr.io/fabriziosalmi/agssh:1.0.0) instead of
    # rebuilding the Dockerfile on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Derive version
        id: v
        run: |
          ref="${GITHUB_REF_NAME}"          # e.g. v1.0.0
          ver="${ref#v}"                     # 1.0.0
          major="${ver%%.*}"                 # 1
          echo "ver=$ver"     >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agssh:${{ steps.v.outputs.ver }}
            ghcr.io/${{ github.repository_owner }}/agssh:${{ steps.v.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/agssh:latest

  retag-major:
    # Only after BOTH the release artifacts and the image exist does the moving
    # major git tag (v1) follow — so @v1 consumers never resolve an action.yml
    # whose pinned image is not published yet. Logic lives in retag-major.yml
    # (single source; also manually dispatchable for retroactive moves).
    needs: [goreleaser, image]
    permissions:
      contents: write
    uses: ./.github/workflows/retag-major.yml
