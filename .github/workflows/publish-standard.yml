# Publish agssh.dev — the standard's own site — and make it wear its own Gold badge.
#
# Pages source = GitHub Actions (not a branch). Pages allows ONE artifact per run,
# so the dogfood loop is a single deploy that bakes in the proof up front:
#   1. build the CSP-clean site
#   2. scan the CURRENTLY-live agssh.dev at Gold/L0 with a SIGNED record, emit an
#      SBOM + the scan-derived badge, and write them into the site
#   3. deploy once (content + fresh badge + signed record + SBOM), then GATE
# The badge reflects the live deployment — one run behind for content changes, but
# the site is deterministic so it stays accurate — and never 404s. The gate reddens
# the run when the live surface is not Gold; the honest badge is deployed regardless.
#
# PREREQUISITES (one-time, see standard/DEPLOY.md):
#   - Settings -> Pages -> Source = GitHub Actions, Custom domain = agssh.dev
#   - Cloudflare in front of agssh.dev injecting the headers + TLS + CAA/DNSSEC
# Until the Cloudflare edge is live, step 2 (the gate) will correctly fail — the
# header/CSP/DNS rules need it. That is the gate working, not a bug. Manual-only
# (workflow_dispatch) until then; add a push trigger once it goes green.
name: publish-standard

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["standard/**", "RULES.md", "internal/rules/version_gen.go", ".github/workflows/publish-standard.yml"]

permissions:
  contents: read
  pages: write
  id-token: write        # Pages deploy + keyless cosign (AG-GOV-05) from an ephemeral runner (AG-GOV-07)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://agssh.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }

      - name: Tools — agssh, cosign, syft (pinned by version)
        run: |
          go build -o /usr/local/bin/agssh ./cmd/agssh
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.18.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Single deploy (Pages=Actions allows one artifact per run). Scan the CURRENTLY
      # live agssh.dev to derive the badge/record, bake them into the site, and
      # deploy once. The badge reflects the live deployment (one run behind for
      # content changes; the site is deterministic, so it stays accurate) and never
      # 404s. No second upload, so no artifact-name conflict.
      - name: Build the CSP-clean site
        run: python3 standard/build_site.py
      - name: Wait for agssh.dev to be reachable
        run: |
          for i in $(seq 1 30); do
            curl -fsS -m 10 https://agssh.dev/ | grep -q "AGSSH-STD-001" && { echo "live"; exit 0; }
            echo "not reachable yet ($i/30)…"; sleep 20
          done
          echo "::error::agssh.dev unreachable"; exit 1
      - name: SBOM (AG-SUP-07) + provenance input (AG-SUP-08)
        run: syft dir:. -o spdx-json > site/sbom.spdx.json
      - name: Scan agssh.dev at Gold/L0, signed — produce the HONEST badge + record
        id: scan
        run: |
          # The badge is a pure function of the record: conformant -> the metal tier,
          # non-conformant -> the grey target tier + score. It is baked into the site
          # below WHATEVER the verdict, so the page always shows the truth; the final
          # gate is what fails the run. Capture the exit code, do not stop here.
          set +e
          agssh -config standard/agssh.dev.airgap.yml \
                -profile Gold -level L0 \
                -repo . -workflows .github/workflows -dist . \
                -author "${{ github.actor }}" -approvers standard/agssh-approvers.txt \
                -sign -out site/conformance.json -badge site/badge.svg
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: site }
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # Fail-closed gate: the honest badge is now live; redden the run unless
      # agssh.dev is Gold-conformant (0 = conformant, 1 = not, 3 = unscannable).
      - name: Gate — fail the run unless agssh.dev is Gold-conformant
        run: |
          [ "${{ steps.scan.outputs.code }}" = "0" ] \
            || { echo "::error::agssh.dev is not Gold-conformant (agssh exit ${{ steps.scan.outputs.code }}); the deployed badge reflects the current state"; exit 1; }
          echo "agssh.dev is Gold-conformant — the medal is earned."
